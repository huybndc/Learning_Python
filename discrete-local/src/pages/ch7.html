<!-- ============================ CHƯƠNG D7 ============================ -->
<section class="page" id="page-ch7">
  <div class="pane" id="pane-ch7-theory">
    <div class="card theory-body" id="theory-ch7-body"></div>
  </div>
  <div class="pane" id="pane-ch7-interactive">
    <div class="card">
      <h2 data-i18n="t7.powTitle"></h2>
      <div class="row">
        <label class="inline">a = <input type="text" id="t7-a" value="7" size="6" inputmode="numeric" autocomplete="off" spellcheck="false"></label>
        <label class="inline">k = <input type="text" id="t7-k" value="45" size="6" inputmode="numeric" autocomplete="off" spellcheck="false"></label>
        <label class="inline">n = <input type="text" id="t7-n" value="13" size="8" inputmode="numeric" autocomplete="off" spellcheck="false"></label>
      </div>
      <p class="small muted" data-i18n="t7.powHint"></p>
      <div id="t7-err" class="small bad"></div>
      <div class="steps-box">
        <p class="small" id="t7-bits"></p>
        <div class="tblbox"><table class="grid" id="t7-table"></table></div>
        <div id="t7-out"></div>
      </div>
    </div>

    <div class="card">
      <h2 data-i18n="t7.rsaTitle"></h2>
      <div class="row">
        <label class="inline">p = <input type="text" id="r-p" value="61" size="6" inputmode="numeric" autocomplete="off" spellcheck="false"></label>
        <label class="inline">q = <input type="text" id="r-q" value="53" size="6" inputmode="numeric" autocomplete="off" spellcheck="false"></label>
        <label class="inline">e = <input type="text" id="r-e" value="17" size="6" inputmode="numeric" autocomplete="off" spellcheck="false"></label>
        <label class="inline"><span data-i18n="t7.msg"></span> m = <input type="text" id="r-m" value="65" size="8" inputmode="numeric" autocomplete="off" spellcheck="false"></label>
      </div>
      <p class="small muted" data-i18n="t7.rsaHint"></p>
      <div id="r-err" class="small bad"></div>
      <div class="steps-box"><div id="r-steps"></div></div>
    </div>
  </div>
</section>
