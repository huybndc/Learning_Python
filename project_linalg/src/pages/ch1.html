<!-- ============================ CHƯƠNG 1 ============================ -->
<section class="page active" id="page-ch1" role="tabpanel" aria-labelledby="tab-ch1">
  <div class="subtabs" role="tablist">
    <button role="tab" id="sub-ch1-theory" aria-selected="true" aria-controls="pane-ch1-theory" data-i18n="sub.theory"></button>
    <button role="tab" id="sub-ch1-example" aria-selected="false" aria-controls="pane-ch1-example" data-i18n="sub.example"></button>
    <button role="tab" id="sub-ch1-interactive" aria-selected="false" aria-controls="pane-ch1-interactive" data-i18n="sub.interactive"></button>
    <button role="tab" id="sub-ch1-practice" aria-selected="false" aria-controls="pane-ch1-practice" data-i18n="sub.practice"></button>
  </div>

  <div class="pane active" id="pane-ch1-theory" role="tabpanel" aria-labelledby="sub-ch1-theory">
    <div class="card theory-body" id="theory-ch1-body"></div>
  </div>

  <!-- ------------------------------ VÍ DỤ ------------------------------ -->
  <div class="pane" id="pane-ch1-example" role="tabpanel" aria-labelledby="sub-ch1-example">
    <div class="card">
      <h2 data-i18n="c1.addTitle"></h2>
      <p class="small muted" style="margin-top:0" data-i18n="c1.addNote"></p>
      <div class="row">
        <label class="inline"><span class="mono">v =</span>
          <input type="text" id="e1-v" class="mono" value="3, 1" style="width:6.5em" autocomplete="off" spellcheck="false">
        </label>
        <label class="inline"><span class="mono">w =</span>
          <input type="text" id="e1-w" class="mono" value="-1, 2" style="width:6.5em" autocomplete="off" spellcheck="false">
        </label>
        <button class="btn primary" id="e1-play" data-i18n="common.play"></button>
      </div>
      <div id="e1-err" class="small bad"></div>
      <div class="boardrow" style="margin-top:12px">
        <div class="board"><canvas id="e1-add"></canvas></div>
        <div class="side">
          <dl class="readout" id="e1-add-out"></dl>
          <p class="small" id="e1-add-step" style="margin:10px 0 0"></p>
        </div>
      </div>
    </div>

    <div class="card">
      <h2 data-i18n="c1.dotTitle"></h2>
      <p class="small muted" style="margin-top:0" data-i18n="c1.dotNote"></p>
      <div class="boardrow">
        <div class="board"><canvas id="e1-dot"></canvas></div>
        <div class="side">
          <div class="sliders">
            <div class="slider">
              <label for="e1-ang" data-i18n="c1.rotate"></label>
              <input type="range" id="e1-ang" min="0" max="360" step="1" value="35">
              <output id="e1-ang-out"></output>
            </div>
          </div>
          <dl class="readout" id="e1-dot-out" style="margin-top:12px"></dl>
          <p style="margin:10px 0 0"><span class="badge" id="e1-dot-sign"></span></p>
          <p class="small muted" id="e1-dot-why" style="margin:8px 0 0"></p>
        </div>
      </div>
    </div>
  </div>

  <!-- ---------------------------- TƯƠNG TÁC ---------------------------- -->
  <div class="pane" id="pane-ch1-interactive" role="tabpanel" aria-labelledby="sub-ch1-interactive">
    <div class="card">
      <h2 data-i18n="c1.dragTitle"></h2>
      <p class="small muted" style="margin-top:0" data-i18n="c1.dragNote"></p>
      <div class="row">
        <label class="inline"><input type="checkbox" id="i1-sum" checked> <span data-i18n="c1.showSum"></span></label>
        <label class="inline"><input type="checkbox" id="i1-diff"> <span data-i18n="c1.showDiff"></span></label>
        <label class="inline"><input type="checkbox" id="i1-proj"> <span data-i18n="c1.showProj"></span></label>
        <button class="btn" id="i1-reset" data-i18n="common.reset"></button>
      </div>
      <div class="boardrow" style="margin-top:12px">
        <div class="board">
          <canvas id="i1-drag"></canvas>
          <span class="hint-drag" data-i18n="common.dragHint"></span>
        </div>
        <div class="side">
          <dl class="readout" id="i1-out"></dl>
          <p style="margin:10px 0 0"><span class="badge" id="i1-rel"></span></p>
        </div>
      </div>
    </div>

    <div class="card">
      <h2 data-i18n="c1.comboTitle"></h2>
      <p class="small muted" style="margin-top:0" data-i18n="c1.comboNote"></p>
      <div class="boardrow">
        <div class="board">
          <canvas id="i1-combo"></canvas>
          <span class="hint-drag" data-i18n="common.dragHint"></span>
        </div>
        <div class="side">
          <div class="sliders">
            <div class="slider">
              <label for="i1-c1" class="mono">c₁</label>
              <input type="range" id="i1-c1" min="-3" max="3" step="0.25" value="1">
              <output id="i1-c1-out"></output>
            </div>
            <div class="slider">
              <label for="i1-c2" class="mono">c₂</label>
              <input type="range" id="i1-c2" min="-3" max="3" step="0.25" value="1">
              <output id="i1-c2-out"></output>
            </div>
          </div>
          <dl class="readout" id="i1-combo-out" style="margin-top:12px"></dl>
          <p style="margin:10px 0 0"><span class="badge" id="i1-span"></span></p>
          <p class="small muted" id="i1-span-why" style="margin:8px 0 0"></p>
        </div>
      </div>
    </div>
  </div>

  <!-- ---------------------------- LUYỆN TẬP ---------------------------- -->
  <div class="pane" id="pane-ch1-practice" role="tabpanel" aria-labelledby="sub-ch1-practice">
    <div class="card">
      <h2 data-i18n="sub.practice"></h2>
      <div class="row">
        <label class="inline"><span data-i18n="common.kind"></span>
          <select id="q1-kind">
            <option value="combine" data-i18n="c1q.kCombine"></option>
            <option value="dot" data-i18n="c1q.kDot"></option>
            <option value="length" data-i18n="c1q.kLength"></option>
            <option value="angle" data-i18n="c1q.kAngle"></option>
            <option value="mix" selected data-i18n="c1q.kMix"></option>
          </select>
        </label>
        <button class="btn primary" id="q1-new" data-i18n="common.newQuestion"></button>
        <span class="small muted" id="q1-score"></span>
      </div>
      <p id="q1-text" class="mono" style="margin:.8em 0 .4em"></p>
      <div class="row">
        <input type="text" id="q1-ans" class="mono" style="flex:1 1 200px" autocomplete="off" spellcheck="false" data-i18n-ph="common.answerPh">
        <button class="btn primary" id="q1-check" data-i18n="common.check"></button>
        <button class="btn" id="q1-show" data-i18n="common.showAnswer"></button>
      </div>
      <p class="small muted" style="margin:.3em 0 0" data-i18n-html="c1q.note"></p>
      <div id="q1-result"></div>
    </div>
  </div>
</section>
