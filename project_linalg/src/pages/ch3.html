<!-- ============================ CHƯƠNG 3 ============================ -->
<section class="page" id="page-ch3" role="tabpanel" aria-labelledby="tab-ch3">
  <div class="subtabs" role="tablist">
    <button role="tab" id="sub-ch3-theory" aria-selected="true" aria-controls="pane-ch3-theory" data-i18n="sub.theory"></button>
    <button role="tab" id="sub-ch3-example" aria-selected="false" aria-controls="pane-ch3-example" data-i18n="sub.example"></button>
    <button role="tab" id="sub-ch3-interactive" aria-selected="false" aria-controls="pane-ch3-interactive" data-i18n="sub.interactive"></button>
    <button role="tab" id="sub-ch3-practice" aria-selected="false" aria-controls="pane-ch3-practice" data-i18n="sub.practice"></button>
  </div>

  <div class="pane active" id="pane-ch3-theory" role="tabpanel" aria-labelledby="sub-ch3-theory">
    <div class="card theory-body" id="theory-ch3-body"></div>
  </div>

  <!-- ------------------------------ VÍ DỤ ------------------------------ -->
  <div class="pane" id="pane-ch3-example" role="tabpanel" aria-labelledby="sub-ch3-example">
    <div class="card">
      <h2 data-i18n="c3.growTitle"></h2>
      <p class="small muted" style="margin-top:0" data-i18n="c3.growNote"></p>
      <div class="step-nav">
        <button class="btn" id="e3-prev" data-i18n="common.prev"></button>
        <button class="btn primary" id="e3-next" data-i18n="common.next"></button>
        <span class="pos" id="e3-pos"></span>
        <span class="badge" id="e3-kind"></span>
      </div>
      <div class="boardrow" style="margin-top:12px">
        <div class="board">
          <canvas id="e3-grow"></canvas>
          <span class="hint-drag" data-i18n="c3.orbitHint"></span>
        </div>
        <div class="side">
          <div class="step" id="e3-step"></div>
          <dl class="readout" id="e3-grow-out" style="margin-top:10px"></dl>
        </div>
      </div>
    </div>

    <div class="card">
      <h2 data-i18n="c3.spacesTitle"></h2>
      <p class="small muted" style="margin-top:0" data-i18n="c3.spacesNote"></p>
      <div class="row">
        <label class="inline"><span data-i18n="c3.preset"></span>
          <select id="e3-preset">
            <option value="rank1" data-i18n="c3.presetRank1"></option>
            <option value="rank2" selected data-i18n="c3.presetRank2"></option>
            <option value="rank3" data-i18n="c3.presetRank3"></option>
          </select>
        </label>
      </div>
      <div class="row" style="align-items:flex-start;margin-top:10px">
        <div id="e3-input"></div>
      </div>
      <div id="e3-err" class="small bad"></div>
      <div class="boardrow" style="margin-top:12px">
        <div class="board">
          <canvas id="e3-spaces"></canvas>
          <span class="hint-drag" data-i18n="c3.orbitHint"></span>
        </div>
        <div class="side">
          <dl class="readout" id="e3-spaces-out"></dl>
          <p class="small" id="e3-rank-law" style="margin:10px 0 0"></p>
          <p class="small muted" id="e3-spaces-why" style="margin:8px 0 0"></p>
        </div>
      </div>
    </div>
  </div>

  <!-- ---------------------------- TƯƠNG TÁC ---------------------------- -->
  <div class="pane" id="pane-ch3-interactive" role="tabpanel" aria-labelledby="sub-ch3-interactive">
    <div class="card">
      <h2 data-i18n="c3.dragTitle"></h2>
      <p class="small muted" style="margin-top:0" data-i18n="c3.dragNote"></p>
      <div class="row">
        <label class="inline"><span data-i18n="c3.vecCount"></span>
          <select id="i3-count">
            <option value="1">1</option>
            <option value="2" selected>2</option>
            <option value="3">3</option>
          </select>
        </label>
        <label class="inline"><input type="checkbox" id="i3-showb" checked> <span data-i18n="c3.showB"></span></label>
        <label class="inline"><input type="checkbox" id="i3-showpatch" checked> <span data-i18n="c3.showPatch"></span></label>
        <button class="btn" id="i3-reset" data-i18n="common.reset"></button>
      </div>
      <div class="boardrow" style="margin-top:12px">
        <div class="board">
          <canvas id="i3-span"></canvas>
          <span class="hint-drag" data-i18n="c3.dragHint3d"></span>
        </div>
        <div class="side">
          <dl class="readout" id="i3-out"></dl>
          <p style="margin:10px 0 0">
            <span class="badge" id="i3-kind"></span>
            <span class="badge" id="i3-inspan"></span>
          </p>
          <p class="small muted" id="i3-why" style="margin:8px 0 0"></p>
        </div>
      </div>
    </div>
  </div>

  <!-- ---------------------------- LUYỆN TẬP ---------------------------- -->
  <div class="pane" id="pane-ch3-practice" role="tabpanel" aria-labelledby="sub-ch3-practice">
    <div class="card">
      <h2 data-i18n="sub.practice"></h2>
      <div class="row">
        <label class="inline"><span data-i18n="common.kind"></span>
          <select id="q3-kind">
            <option value="independent" data-i18n="c3q.kIndependent"></option>
            <option value="spankind" data-i18n="c3q.kSpanKind"></option>
            <option value="inspan" data-i18n="c3q.kInSpan"></option>
            <option value="nulldim" data-i18n="c3q.kNullDim"></option>
            <option value="mix" selected data-i18n="c3q.kMix"></option>
          </select>
        </label>
        <button class="btn primary" id="q3-new" data-i18n="common.newQuestion"></button>
        <span class="small muted" id="q3-score"></span>
      </div>
      <p id="q3-text" class="mono" style="margin:.8em 0 .4em"></p>
      <div class="row">
        <input type="text" id="q3-ans" class="mono" style="flex:1 1 200px" autocomplete="off" spellcheck="false" data-i18n-ph="common.answerPh">
        <select id="q3-choice" style="flex:1 1 200px"></select>
        <button class="btn primary" id="q3-check" data-i18n="common.check"></button>
        <button class="btn" id="q3-show" data-i18n="common.showAnswer"></button>
      </div>
      <p class="small muted" style="margin:.3em 0 0" data-i18n="c3q.note"></p>
      <div id="q3-result"></div>
    </div>
  </div>
</section>
