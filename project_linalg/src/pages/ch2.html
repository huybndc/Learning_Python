<!-- ============================ CHƯƠNG 2 ============================ -->
<section class="page" id="page-ch2" role="tabpanel" aria-labelledby="tab-ch2">
  <div class="subtabs" role="tablist">
    <button role="tab" id="sub-ch2-theory" aria-selected="true" aria-controls="pane-ch2-theory" data-i18n="sub.theory"></button>
    <button role="tab" id="sub-ch2-example" aria-selected="false" aria-controls="pane-ch2-example" data-i18n="sub.example"></button>
    <button role="tab" id="sub-ch2-interactive" aria-selected="false" aria-controls="pane-ch2-interactive" data-i18n="sub.interactive"></button>
    <button role="tab" id="sub-ch2-practice" aria-selected="false" aria-controls="pane-ch2-practice" data-i18n="sub.practice"></button>
  </div>

  <div class="pane active" id="pane-ch2-theory" role="tabpanel" aria-labelledby="sub-ch2-theory">
    <div class="card theory-body" id="theory-ch2-body"></div>
  </div>

  <!-- ------------------------------ VÍ DỤ ------------------------------ -->
  <div class="pane" id="pane-ch2-example" role="tabpanel" aria-labelledby="sub-ch2-example">
    <div class="card">
      <h2 data-i18n="c2.elimTitle"></h2>
      <p class="small muted" style="margin-top:0" data-i18n="c2.elimNote"></p>
      <div class="row">
        <label class="inline"><span data-i18n="c2.preset"></span>
          <select id="e2-preset">
            <option value="u2" data-i18n="c2.presetUnique2"></option>
            <option value="u3" selected data-i18n="c2.presetUnique3"></option>
            <option value="inf" data-i18n="c2.presetInfinite"></option>
            <option value="none" data-i18n="c2.presetNone"></option>
          </select>
        </label>
        <button class="btn" id="e2-random" data-i18n="c2.random"></button>
      </div>
      <div class="row" style="align-items:flex-start;margin-top:10px">
        <div id="e2-input"></div>
        <div style="flex:1 1 auto"></div>
      </div>
      <div id="e2-err" class="small bad"></div>
      <p class="mono small" id="e2-system" style="margin:10px 0 0"></p>

      <div class="step-nav" style="margin-top:14px">
        <button class="btn" id="e2-prev" data-i18n="common.prev"></button>
        <button class="btn primary" id="e2-next" data-i18n="common.next"></button>
        <span class="pos" id="e2-pos"></span>
        <span class="badge" id="e2-phase"></span>
      </div>
      <div class="row" style="align-items:flex-start;gap:18px;margin-top:12px">
        <div id="e2-matrix"></div>
        <div class="side" style="flex:1 1 260px;min-width:0">
          <div class="step" id="e2-step"></div>
        </div>
      </div>
      <div id="e2-concl" style="margin-top:12px"></div>
    </div>

    <div class="card">
      <h2 data-i18n="c2.rowPicTitle"></h2>
      <p class="small muted" style="margin-top:0" data-i18n="c2.rowPicNote"></p>
      <div class="boardrow">
        <div class="board"><canvas id="e2-lines"></canvas></div>
        <div class="side">
          <dl class="readout" id="e2-lines-out"></dl>
          <p class="small muted" id="e2-lines-note" style="margin:10px 0 0"></p>
        </div>
      </div>
    </div>
  </div>

  <!-- ---------------------------- TƯƠNG TÁC ---------------------------- -->
  <div class="pane" id="pane-ch2-interactive" role="tabpanel" aria-labelledby="sub-ch2-interactive">
    <div class="card">
      <h2 data-i18n="c2.opTitle"></h2>
      <p class="small muted" style="margin-top:0" data-i18n="c2.opNote"></p>
      <div class="row">
        <label class="inline"><span data-i18n="c2.opKind"></span>
          <select id="i2-op">
            <option value="add" selected data-i18n="c2.opAdd"></option>
            <option value="swap" data-i18n="c2.opSwap"></option>
            <option value="scale" data-i18n="c2.opScale"></option>
          </select>
        </label>
        <label class="inline"><span id="i2-lbl-i" class="mono"></span>
          <select id="i2-i"></select>
        </label>
        <label class="inline" id="i2-wrap-k"><span class="mono">k =</span>
          <input type="text" id="i2-k" class="mono" value="-2" style="width:4.5em" autocomplete="off" spellcheck="false">
        </label>
        <label class="inline" id="i2-wrap-j"><span id="i2-lbl-j" class="mono"></span>
          <select id="i2-j"></select>
        </label>
        <button class="btn primary" id="i2-apply" data-i18n="c2.apply"></button>
        <button class="btn" id="i2-undo" data-i18n="c2.undo"></button>
        <button class="btn" id="i2-hint" data-i18n="c2.hintNext"></button>
        <button class="btn" id="i2-reset" data-i18n="common.reset"></button>
      </div>
      <p class="mono small" id="i2-preview" style="margin:10px 0 0"></p>
      <div id="i2-err" class="small bad"></div>
      <div class="row" style="align-items:flex-start;gap:18px;margin-top:12px">
        <div id="i2-matrix"></div>
        <div class="side" style="flex:1 1 240px;min-width:0">
          <p style="margin:0"><span class="badge" id="i2-status"></span></p>
          <dl class="readout" id="i2-out" style="margin-top:10px"></dl>
        </div>
      </div>
      <h3 data-i18n="c2.history"></h3>
      <div class="steps" id="i2-history"></div>
    </div>
  </div>

  <!-- ---------------------------- LUYỆN TẬP ---------------------------- -->
  <div class="pane" id="pane-ch2-practice" role="tabpanel" aria-labelledby="sub-ch2-practice">
    <div class="card">
      <h2 data-i18n="sub.practice"></h2>
      <div class="row">
        <label class="inline"><span data-i18n="common.kind"></span>
          <select id="q2-kind">
            <option value="solve2" data-i18n="c2q.kSolve2"></option>
            <option value="solve3" data-i18n="c2q.kSolve3"></option>
            <option value="classify" data-i18n="c2q.kClassify"></option>
            <option value="rank" data-i18n="c2q.kRank"></option>
            <option value="mix" selected data-i18n="c2q.kMix"></option>
          </select>
        </label>
        <button class="btn primary" id="q2-new" data-i18n="common.newQuestion"></button>
        <span class="small muted" id="q2-score"></span>
      </div>
      <p id="q2-text" style="margin:.8em 0 .4em"></p>
      <div class="mono" id="q2-system" style="margin:0 0 .6em"></div>
      <div class="row">
        <input type="text" id="q2-ans" class="mono" style="flex:1 1 200px" autocomplete="off" spellcheck="false" data-i18n-ph="common.answerPh">
        <select id="q2-choice" style="flex:1 1 200px"></select>
        <button class="btn primary" id="q2-check" data-i18n="common.check"></button>
        <button class="btn" id="q2-show" data-i18n="common.showAnswer"></button>
      </div>
      <p class="small muted" style="margin:.3em 0 0" data-i18n-html="c2q.note"></p>
      <div id="q2-result"></div>
    </div>
  </div>
</section>
